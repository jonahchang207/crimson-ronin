# CRIMSON RONIN // atmospheric lock
general {
    hide_cursor = true
    immediate_render = true
}

auth { pam { enabled = true } }

animations {
    enabled = true
    bezier = ronin, 0.16, 1, 0.30, 1
    animation = fade, 1, 2.8, ronin
    animation = inputField, 1, 3.2, ronin
}

background {
    monitor = DP-1
    path = __HOME__/.local/share/crimson-ronin/assets/crimson-ronin-4k.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.38
    contrast = 1.12
    vibrancy = 0.08
}

image {
    monitor = DP-1
    path = __HOME__/.local/share/crimson-ronin/assets/ronin-mark.png
    size = 54
    rounding = 12
    border_size = 0
    position = 0, 215
    halign = center
    valign = center
}

label {
    monitor = DP-1
    text = $TIME24
    color = rgba(245, 242, 239, 1.0)
    font_size = 76
    font_family = JetBrainsMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.85)
}

label {
    monitor = DP-1
    text = cmd[update:3600000] date '+%A  ·  %d %B'
    color = rgba(144, 137, 139, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 39
    halign = center
    valign = center
}

input-field {
    monitor = DP-1
    size = 330, 52
    outline_thickness = 2
    inner_color = rgba(8, 8, 11, 0.82)
    outer_color = rgba(53, 7, 11, 0.95) rgba(226, 26, 40, 0.95) 30deg
    font_color = rgba(245, 242, 239, 1.0)
    check_color = rgba(144, 137, 139, 1.0)
    fail_color = rgba(255, 41, 56, 1.0)
    rounding = 13
    dots_size = 0.20
    dots_spacing = 0.36
    placeholder_text = <span foreground="##90898B">PASSWORD</span>
    fail_text = <span foreground="##FF2938">ACCESS DENIED</span>
    position = 0, -52
    halign = center
    valign = center
}
